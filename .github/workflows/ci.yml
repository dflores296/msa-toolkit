name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Suite de regresion del motor ANOVA
        run: node tests/run-node.js

      # --check no escribe: falla el build si las cifras de la documentacion se
      # despegaron de los datos, o si el motor dejo de reproducir los valores
      # publicados de Minitab. Regenerarlas es parte del cambio, no del deploy.
      - name: Verificar las cifras de la documentacion
        run: node tools/build-cifras.js --check
